filebeat.inputs:
  # ── Nginx Access Logs ──────────────────────────────────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
      - /var/log/nginx/*.log
    fields:
      log_type: nginx_access
      service: hbids-nginx
    fields_under_root: true

    # Parse common Nginx log format
    multiline.pattern: '^\d+\.\d+\.\d+\.\d+'
    multiline.negate: true
    multiline.match: after

  # ── Detection Engine Logs ──────────────────────────────────────────────────
  - type: log
    enabled: true
    paths:
      - /app/logs/detection_engine.log
    fields:
      log_type: detection_engine
      service: hbids-detection
    fields_under_root: true
    json.keys_under_root: true
    json.add_error_key: true

# ── Processors ────────────────────────────────────────────────────────────────
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded

  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      when:
        contains:
          log_type: "detection_engine"

  - timestamp:
      field: "@timestamp"
      layouts:
        - "2006-01-02T15:04:05Z"
        - "2006-01-02T15:04:05.999Z"
      test:
        - "2026-01-01T00:00:00Z"

# ── Output: Elasticsearch ─────────────────────────────────────────────────────
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  protocol: "http"

  indices:
    - index: "nginx-logs-%{[agent.version]}-%{+yyyy.MM.dd}"
      when.contains:
        log_type: "nginx_access"

    - index: "detection-logs-%{[agent.version]}-%{+yyyy.MM.dd}"
      when.contains:
        log_type: "detection_engine"

  # Retry settings
  timeout: 60
  max_retries: 5
  backoff.init: 1s
  backoff.max: 60s

# ── Internal Queue (Buffer During ES Downtime) ────────────────────────────────
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level: warning
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0600

# ── Monitoring (self-metrics to ES) ──────────────────────────────────────────
monitoring.enabled: false
