version: "3.8"

services:
  # ──────────────────────────────────────────────
  # Nginx - The web application being monitored
  # Why Nginx: Real production web server (not synthetic).
  # Generates authentic access logs in structured JSON format
  # that mirror what real-world deployments produce.
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:latest
    ports:
      - "18080:80"
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ids-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  # Filebeat - Ships Nginx logs to Elasticsearch
  # Why Filebeat: Industry-standard log shipper used in production.
  # Handles log rotation, backpressure, and at-least-once delivery
  # guarantees - exactly what a real IDS pipeline requires.
  # ──────────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./nginx/logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - ids-network
    command: filebeat -e -strict.perms=false

  # ──────────────────────────────────────────────
  # Elasticsearch - Log storage and query engine
  # Central store for all ingested Nginx logs.
  # Detection engine queries here for behavioral analysis.
  # ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ports:
      - "19200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ids-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────
  # Kibana - Visualization and log exploration
  # Optional but highly useful for manual inspection
  # of log patterns during baseline collection.
  # ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "15601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - ids-network

  # ──────────────────────────────────────────────
  # Prometheus - Time-series metrics collection
  # Why Prometheus: Tracks detection engine metrics in real-time
  # (alerts/sec, model inference latency, false positive rate).
  # These metrics are TIME-SERIES, unlike log events in ES.
  # Scrapes /metrics endpoint from the detection service.
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - ids-network

  # ──────────────────────────────────────────────
  # MLflow - ML experiment tracking
  # Tracks every model training run: parameters,
  # metrics (precision/recall/F1), and artifacts.
  # Enables reproducible, auditable detection models.
  # ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "15000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow
    networks:
      - ids-network

  # ──────────────────────────────────────────────
  # Detection Service - The IDS brain
  # Python service that queries ES, runs ML models,
  # exposes Prometheus metrics, and logs to MLflow.
  # Built from ./detection_engine directory.
  # ──────────────────────────────────────────────
  detection:
    build: ./detection_engine
    depends_on:
      - elasticsearch
      - prometheus
    ports:
      - "18000:8000"
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - PROMETHEUS_PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    networks:
      - ids-network

  # ──────────────────────────────────────────────
  # MongoDB - Storage for Cyberpunk Dashboard
  # Required by the new FastAPI backend (server.py)
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    ports:
      - "12701:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ids-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  es-data:
    driver: local
  prometheus-data:
    driver: local
  mlflow-data:
    driver: local
  mongo-data:
    driver: local

networks:
  ids-network:
    driver: bridge
