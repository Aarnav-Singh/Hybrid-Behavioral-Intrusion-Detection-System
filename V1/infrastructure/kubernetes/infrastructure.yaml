---
apiVersion: v1
kind: Namespace
metadata:
  name: hbids
  labels:
    project: hybrid-behavioral-ids

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbids-elasticsearch
  namespace: hbids
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hbids
      component: elasticsearch
  template:
    metadata:
      labels:
        app: hbids
        component: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: hbids-es-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: hbids
spec:
  selector:
    app: hbids
    component: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hbids-es-pvc
  namespace: hbids
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hbids-models-pvc
  namespace: hbids
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
