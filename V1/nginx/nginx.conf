worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────────────────────────────────
    # Structured JSON logging - the cornerstone of our IDS pipeline.
    #
    # WHY JSON: Filebeat ships this directly to Elasticsearch without
    # any parsing/grok patterns needed. Every field is individually
    # queryable and indexable, enabling fast aggregations for detection.
    #
    # KEY FIELDS for behavioral analysis:
    #   - remote_addr     → Track per-IP request rates (rate-based detection)
    #   - request_uri     → Detect scanning (low-entropy endpoint access)
    #   - status          → Error spike detection (>30% 4xx = likely attack)
    #   - request_time    → Response time anomaly detection (slowloris)
    #   - http_user_agent → UA rotation detection (bot behavior)
    # ─────────────────────────────────────────────────────────────────
    log_format detailed_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"gzip_ratio":"$gzip_ratio"'
    '}';

    access_log /var/log/nginx/access.log detailed_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zones - used to simulate realistic backpressure
    # These limits are intentionally loose so our IDS (not nginx) detects attacks
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/s;

    server {
        listen 80;
        server_name _;

        # ── Home / root endpoint ──────────────────────────────────────
        location / {
            add_header Content-Type text/plain;
            add_header X-Request-ID $request_id;
            return 200 "Welcome to the application\n";
        }

        # ── Users API endpoint ────────────────────────────────────────
        # This endpoint will be targeted in scanning simulations.
        # Generates realistic 200 responses for baseline.
        location /api/users {
            add_header Content-Type application/json;
            limit_req zone=api burst=20 nodelay;
            return 200 '{"users": ["alice", "bob", "charlie"], "total": 3}';
        }

        # ── Data API endpoint ─────────────────────────────────────────
        location /api/data {
            add_header Content-Type application/json;
            limit_req zone=api burst=20 nodelay;
            return 200 '{"data": "sample", "version": "1.0", "status": "ok"}';
        }

        # ── Products endpoint ─────────────────────────────────────────
        location /products {
            add_header Content-Type application/json;
            return 200 '{"products": [{"id": 1, "name": "Widget A"}, {"id": 2, "name": "Widget B"}]}';
        }

        # ── Search endpoint ───────────────────────────────────────────
        location /search {
            add_header Content-Type application/json;
            return 200 '{"results": [], "query": "received", "count": 0}';
        }

        # ── About page ────────────────────────────────────────────────
        location /about {
            add_header Content-Type text/plain;
            return 200 "About this application - v1.0.0\n";
        }

        # ── Contact page ──────────────────────────────────────────────
        location /contact {
            add_header Content-Type text/plain;
            return 200 "Contact: support@example.com\n";
        }

        # ── Profile page ──────────────────────────────────────────────
        location /profile {
            add_header Content-Type application/json;
            return 200 '{"user": "guest", "role": "viewer"}';
        }

        # ── Admin - Protected (always 403) ───────────────────────────
        # KEY DETECTION SIGNAL: repeated hits to /admin indicate
        # privilege escalation attempts. Baseline shows near-zero /admin hits.
        location /admin {
            add_header Content-Type text/plain;
            return 403 "Forbidden\n";
        }

        # ── Health check endpoint ─────────────────────────────────────
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status": "healthy", "service": "nginx"}';
        }

        # ── Metrics endpoint (forwarded to detection service) ─────────
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 172.20.0.0/16;
            deny all;
        }

        # ── Catch-all: 404 for unknown paths ─────────────────────────
        # KEY DETECTION SIGNAL: High 404 rate indicates path scanning.
        # Baseline establishes normal 404 rate (~5%).
        location ~* ^/.+ {
            add_header Content-Type text/plain;
            return 404 "Not Found\n";
        }
    }
}
