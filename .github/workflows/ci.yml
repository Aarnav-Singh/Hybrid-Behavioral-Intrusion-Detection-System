name: HB-IDS CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 ml_engine/ detection_engine/ backend/ scripts/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full lint with warnings only (don't fail on style)
          flake8 ml_engine/ detection_engine/ backend/ scripts/ \
            --count --exit-zero --max-line-length=120 --statistics

      - name: Run unit tests
        run: |
          # Run identified unit tests
          pytest tests/test_fusion.py tests/test_ml_engine.py -v --tb=short

      - name: Verify Research Quality Gate
        run: |
          # Ensure model performance meets research standards
          python scripts/quality_gate.py

      - name: Test ML engine import
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ml_engine import features
          print('ml_engine.features import OK')
          from backend import server
          print('backend.server import OK')
          from detection_engine import rules
          print('detection_engine.rules import OK')
          "

      - name: Validate docker-compose syntax
        run: |
          pip install docker-compose 2>/dev/null || true
          docker compose config --quiet && echo "docker-compose.yml syntax OK" || echo "docker compose validation skipped"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit -r ml_engine/ detection_engine/ backend/ scripts/ \
            -ll --format txt || echo "Bandit scan complete (review output above)"
