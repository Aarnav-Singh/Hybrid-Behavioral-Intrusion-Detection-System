name: CodeRabbit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    if: "github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '@coderabbitai'))"
    steps:
      - name: CodeRabbit
        uses: coderabbitai/coderabbit-action@v1
